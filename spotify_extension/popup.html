<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Auto-Checkout</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="app">

        <!-- MAIN SCREEN -->
        <div id="mainScreen" class="screen">
            <header class="header">
                <div class="brand">
                    <div class="logo-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.563.387-.857.207-2.35-1.437-5.305-1.76-8.786-.963-.335.077-.67-.133-.745-.469-.077-.336.132-.67.469-.745 3.808-.87 7.076-.496 9.713 1.114.294.18.386.563.206.856zm1.223-2.722c-.226.367-.706.482-1.072.257-2.687-1.652-6.785-2.131-9.965-1.166-.413.127-.848-.106-.973-.517-.125-.413.108-.848.518-.973 3.632-1.102 8.147-.568 11.235 1.327.366.226.48.707.257 1.072zm.105-2.835c-3.223-1.914-8.54-2.09-11.618-1.156-.494.15-1.017-.128-1.166-.623-.15-.494.128-1.017.623-1.166 3.53-1.073 9.404-.866 13.115 1.337.445.264.59.838.327 1.282-.264.443-.838.59-1.281.326z" />
                        </svg>
                    </div>
                    <div>
                        <h1>Spotify <span class="pro">Auto Checkout</span></h1>
                        <p class="sub">KaiSpotify</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="reloadTabBtn" title="Reload Page">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6" />
                            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                        </svg>
                    </button>
                    <button class="icon-btn" id="settingsBtn" title="Settings">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-dot">
                    <span class="dot" id="statusDot"></span>
                    <span id="pageStatus">Waiting...</span>
                </div>
                <div class="stats-row">
                    <span class="stat-pill tried" id="statTried">Tried: 0</span>
                    <span class="stat-pill live" id="statLive">Live: 0</span>
                    <span class="stat-pill dead" id="statDead">Dead: 0</span>
                </div>
            </div>

            <!-- Progress bar -->
            <div class="progress-wrap" id="progressWrap" style="display:none">
                <div class="progress-bar" id="progressBar"></div>
                <span class="progress-label" id="progressLabel">0 / 0</span>
            </div>

            <!-- ══ CARD SETUP ══ -->
            <div class="card-form">
                <div class="section-header">
                    <div class="section-label">Card Setup</div>
                    <div class="tab-toggle">
                        <button class="tab-btn active" id="tabBin" data-tab="bin">BIN</button>
                        <button class="tab-btn" id="tabManual" data-tab="manual">Manual List</button>
                    </div>
                </div>

                <!-- BIN mode -->
                <div id="binPanel">
                    <!-- Network selector -->
                    <div class="card-type-row" style="margin-bottom:10px">
                        <button class="type-btn" data-type="VISA"><span class="type-icon">VISA</span></button>
                        <button class="type-btn" data-type="MASTERCARD"><span class="type-icon">MC</span></button>
                        <button class="type-btn" data-type="UNIONPAY"><span class="type-icon">UP</span></button>
                    </div>

                    <div class="field">
                        <label>BIN <span class="hint">6–8 digits</span></label>
                        <div class="bin-wrapper">
                            <input type="text" id="binInput" placeholder="e.g. 453275" maxlength="12"
                                inputmode="numeric" autocomplete="off">
                            <span id="binTypeBadge" class="type-badge">AUTO</span>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Month <span class="hint"></span></label>
                            <input type="text" id="monthInput" placeholder="MM" maxlength="2" inputmode="numeric">
                        </div>
                        <div class="field">
                            <label>Year <span class="hint"></span></label>
                            <input type="text" id="yearInput" placeholder="YYYY" maxlength="4" inputmode="numeric">
                        </div>
                        <div class="field">
                            <label>CVV <span class="hint"></span></label>
                            <input type="text" id="cvvInput" placeholder="•••" maxlength="4" inputmode="numeric">
                        </div>
                    </div>
                </div>

                <!-- Manual list mode -->
                <div id="manualPanel" style="display:none">
                    <div class="field">
                        <label>Card List <span class="hint">num|mm|yyyy|cvv one per line</span></label>
                        <textarea id="cardListInput" rows="5"
                            placeholder="4111111111111111|06|2030|123&#10;5555555555554444|12|2028|456&#10;..."></textarea>
                    </div>
                </div>


                <!-- RUN / STOP buttons -->
                <div class="btn-row">
                    <button id="runBtn" class="fill-btn fill-btn-run">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        Run
                    </button>
                    <button id="stopBtn" class="fill-btn fill-btn-stop" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" />
                        </svg>
                        Stop
                    </button>
                </div>
            </div>

            <!-- Log Panel -->
            <div class="log-panel">
                <div class="log-header">
                    <span>Fill Log</span>
                    <div style="display:flex;gap:8px;align-items:center">
                        <label class="autoscroll-label">
                            <input type="checkbox" id="autoScrollChk" checked> Auto
                        </label>
                        <button id="clearLogBtn" class="clear-log-btn">Clear</button>
                        <button id="exportLogBtn" class="clear-log-btn" title="Export log">⬇</button>
                    </div>
                </div>
                <div id="logContainer" class="log-body">
                    <div class="log-empty">Waiting to start...</div>
                </div>
            </div>
        </div>

        <!-- SETTINGS SCREEN -->
        <div id="settingsScreen" class="screen" style="display:none;">
            <header class="header">
                <button class="icon-btn" id="backBtn" title="Back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <h1 style="font-size:15px;font-weight:700">Settings</h1>
                <div style="width:34px"></div>
            </header>

            <div class="settings-body">
                <div class="settings-section-title">💳 Default Card</div>
                <div class="setting-group">
                    <div class="setting-label">Default BIN</div>
                    <input type="text" id="s_bin" placeholder="6+ digits" maxlength="12" inputmode="numeric">
                </div>
                <div class="row">
                    <div class="setting-group">
                        <div class="setting-label">Month <span class="hint">rand</span></div>
                        <input type="text" id="s_month" placeholder="MM" maxlength="2">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">Year <span class="hint">rand</span></div>
                        <input type="text" id="s_year" placeholder="YYYY" maxlength="4">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">CVV <span class="hint">rand</span></div>
                        <input type="text" id="s_cvv" placeholder="•••" maxlength="4">
                    </div>
                </div>
                <div class="settings-section-title" style="margin-top:8px">⚙️ Behavior</div>
                <div class="row">
                    <div class="setting-group">
                        <div class="setting-label">Fill Delay (ms)</div>
                        <input type="number" id="s_fillDelay" value="300" min="50" max="3000">
                    </div>
                    <div class="setting-group">
                        <div class="setting-label">Loop Delay (ms)</div>
                        <input type="number" id="s_loopDelay" value="2000" min="100" max="30000">
                    </div>
                </div>
                <button id="saveSettingsBtn" class="fill-btn" style="margin-top:8px">💾 Save</button>
            </div>
        </div>

    </div>

    <script src="cardGenerator.js"></script>
    <script src="popup.js"></script>
</body>

</html>
